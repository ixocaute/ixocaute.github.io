<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gustos | Ixomar Cautela</title>
  <style>
    :root {
      --night-deep: #0a1428;
      --star-yellow: #f4d35e;
      --text-main: #f0e6d3;
      --text-soft: #b8a99a;
      --page-bg: #1a2a4a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--night-deep);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Navegación */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.3rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(10, 20, 40, 0.9), transparent);
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 1.35rem;
      color: var(--star-yellow);
      text-decoration: none;
      letter-spacing: 0.06em;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-soft);
      text-decoration: none;
      font-size: 0.88rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      position: relative;
      transition: color 0.3s;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--star-yellow);
      transition: width 0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--star-yellow);
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--star-yellow);
      font-size: 1.6rem;
      cursor: pointer;
    }

    /* Título de la página */
    .book-header {
      text-align: center;
      margin-top: 6.5rem;
      margin-bottom: 1.5rem;
      padding: 0 1.5rem;
    }

    .book-header .label {
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--star-yellow);
      margin-bottom: 0.6rem;
    }

    .book-header h1 {
      font-family: Georgia, serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 400;
    }

    /* ========== EL LIBRO ========== */
    .book-container {
      position: relative;
      width: 100%;
      max-width: 920px;
      height: 520px;
      margin: 0 auto 3rem;
      perspective: 2000px;
    }

    .book {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      border-radius: 8px;
      overflow: hidden;
    }

    .page {
      flex: 1;
      background: var(--page-bg);
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      border: 1px solid rgba(244, 211, 94, 0.12);
    }

    .page.left {
      border-right: 1px solid rgba(244, 211, 94, 0.15);
      text-align: right;
    }
