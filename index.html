<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ixomar Cautela</title>
  <style>
    :root {
      --night-deep: #0c1a3a;
      --star-yellow: #f7e27a;
      --text-main: #f0e6d3;
      --text-soft: #b8a99a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--night-deep);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    #sky {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }

    /* Navegación */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.3rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(12,26,58,0.75), transparent);
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 1.35rem;
      color: var(--star-yellow);
      text-decoration: none;
      letter-spacing: 0.06em;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-soft);
      text-decoration: none;
      font-size: 0.88rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      position: relative;
      transition: color 0.3s;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 1px;
      background: var(--star-yellow);
      transition: width 0.3s;
    }

    .nav-links a:hover { color: var(--star-yellow); }
    .nav-links a:hover::after { width: 100%; }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--star-yellow);
      font-size: 1.6rem;
      cursor: pointer;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .hero-tag {
      font-size: 0.85rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--star-yellow);
      margin-bottom: 1.3rem;
      opacity: 0;
      animation: fadeUp 1.2s 0.3s forwards;
    }

    .hero h1 {
      font-family: Georgia, serif;
      font-size: clamp(2.8rem, 7vw, 4.6rem);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 1.3rem;
      opacity: 0;
      animation: fadeUp 1.2s 0.5s forwards;
    }

    .hero h1 span {
      color: var(--star-yellow);
      font-style: italic;
    }

    .hero-subtitle {
      font-size: 1.2rem;
      color: var(--text-soft);
      max-width: 460px;
      margin: 0 auto 2.8rem;
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 1.2s 0.7s forwards;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.95rem 2.1rem;
      background: transparent;
      border: 1px solid var(--star-yellow);
      color: var(--star-yellow);
      text-decoration: none;
      font-size: 0.88rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 50px;
      transition: all 0.4s ease;
      opacity: 0;
      animation: fadeUp 1.2s 0.9s forwards;
    }

    .hero-cta:hover {
      background: var(--star-yellow);
      color: var(--night-deep);
      box-shadow: 0 0 35px rgba(247, 226, 122, 0.45);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(25px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .scroll-hint {
      position: absolute;
      bottom: 2.8rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--text-soft);
      opacity: 0;
      animation: fadeUp 1.2s 1.2s forwards;
    }

    @media (max-width: 768px) {
      .nav { padding: 1.1rem 1.5rem; }
      .nav-links {
        display: none;
        position: absolute;
        top: 100%; left: 0; right: 0;
        background: rgba(12,26,58,0.97);
        flex-direction: column;
        padding: 1.5rem;
        gap: 1.3rem;
      }
      .nav-links.open { display: flex; }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>

  <canvas id="sky"></canvas>

  <nav class="nav">
    <a href="#" class="logo">✦ Ixomar Cautela</a>
    <button class="menu-toggle">☰</button>
    <ul class="nav-links">
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Gustos</a></li>
      <li><a href="#">Experiencias</a></li>
      <li><a href="#">Trabajos</a></li>
      <li><a href="#">Contacto</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div>
      <p class="hero-tag">Bienvenida a mi universo</p>
      <h1>Ixomar Cautela<br><span>entre estrellas y sueños</span></h1>
      <p class="hero-subtitle">
        Un espacio donde comparto lo que me mueve, lo que he vivido 
        y lo que creo con las manos y el corazón.
      </p>
      <a href="#" class="hero-cta">Explorar →</a>
    </div>
    <div class="scroll-hint">Desliza para descubrir</div>
  </section>

  <script>
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    let w, h, time = 0;

    // Estrellas grandes estilo Van Gogh (con anillos)
    const bigStars = [
      { x: 0.82, y: 0.18, size: 1.0 },   // la grande de la derecha (luna/estrella)
      { x: 0.22, y: 0.15, size: 0.55 },
      { x: 0.45, y: 0.28, size: 0.4 },
      { x: 0.68, y: 0.22, size: 0.35 },
      { x: 0.12, y: 0.38, size: 0.3 },
      { x: 0.35, y: 0.12, size: 0.28 },
      { x: 0.55, y: 0.15, size: 0.25 },
      { x: 0.78, y: 0.42, size: 0.22 }
    ];

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    // Dibuja una estrella con anillos (como en el cuadro)
    function drawVanGoghStar(x, y, radius, intensity) {
      // Anillos exteriores
      for (let i = 5; i >= 1; i--) {
        const r = radius * (1 + i * 0.55);
        const alpha = (0.07 / i) * intensity;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 230, 140, ${alpha})`;
        ctx.fill();
      }
      // Núcleo brillante
      const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
      gradient.addColorStop(0, `rgba(255, 250, 220, ${0.95 * intensity})`);
      gradient.addColorStop(0.4, `rgba(247, 226, 122, ${0.8 * intensity})`);
      gradient.addColorStop(1, `rgba(247, 226, 122, 0)`);
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    // Dibuja un remolino grueso tipo pincelada
    function drawSwirl(cx, cy, maxRadius, rotation, clockwise = true) {
      const dir = clockwise ? 1 : -1;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let layer = 0; layer < 6; layer++) {
        ctx.beginPath();
        const startAngle = rotation + layer * 0.4;
        for (let a = 0; a < Math.PI * 2.8; a += 0.08) {
          const r = (a / (Math.PI * 2.8)) * maxRadius * (0.7 + layer * 0.08);
          const x = cx + Math.cos(startAngle + a * dir) * r;
          const y = cy + Math.sin(startAngle + a * dir) * r * 0.72;
          if (a === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = layer % 2 === 0 
          ? `rgba(70, 120, 200, ${0.11 - layer * 0.012})` 
          : `rgba(100, 160, 230, ${0.09 - layer * 0.01})`;
        ctx.lineWidth = 14 - layer * 1.5;
        ctx.stroke();
      }
    }

    function draw() {
      // Fondo base
      ctx.fillStyle = '#0c1a3a';
      ctx.fillRect(0, 0, w, h);

      time += 0.0035; // velocidad muy lenta y solemne

      // === REMOLINOS GRANDES (estilo pincelada) ===
      // Remolino central grande
      drawSwirl(w * 0.55, h * 0.38, Math.min(w, h) * 0.42, time * 0.6, true);
      // Remolino izquierdo
      drawSwirl(w * 0.28, h * 0.32, Math.min(w, h) * 0.28, -time * 0.45, false);
      // Remolino derecho más pequeño
      drawSwirl(w * 0.78, h * 0.45, Math.min(w, h) * 0.22, time * 0.7, true);
      // Remolino inferior suave
      drawSwirl(w * 0.4, h * 0.62, Math.min(w, h) * 0.25, -time * 0.35, false);

      // === ESTRELLAS GRANDES CON ANILLOS ===
      bigStars.forEach((star, i) => {
        const pulse = 0.85 + Math.sin(time * 1.5 + i) * 0.15;
        drawVanGoghStar(
          star.x * w,
          star.y * h,
          star.size * Math.min(w, h) * 0.045,
          pulse
        );
      });

      // Estrellas pequeñas que titilan
      for (let i = 0; i < 60; i++) {
        const x = (Math.sin(i * 127.1) * 0.5 + 0.5) * w;
        const y = (Math.cos(i * 91.3) * 0.5 + 0.5) * h;
        const alpha = 0.3 + Math.sin(time * 2 + i) * 0.3;
        ctx.beginPath();
        ctx.arc(x, y, 1.1, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 240, 180, ${alpha})`;
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    resize();
    draw();
    window.addEventListener('resize', resize);

    // Menú móvil
    document.querySelector('.menu-toggle').addEventListener('click', () => {
      document.querySelector('.nav-links').classList.toggle('open');
    });
  </script>
</body>
</html>
