<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ixomar Cautela</title>
  <style>
    /* ============================================
       COLORES PRINCIPALES (fáciles de cambiar)
       ============================================ */
    :root {
      --night-deep: #0a1428;      /* Azul muy oscuro */
      --night-mid: #1a2a4a;       /* Azul intermedio */
      --star-yellow: #f4d35e;     /* Amarillo de las estrellas */
      --star-gold: #ffec8b;       /* Amarillo más claro */
      --moon: #f7e9a0;            /* Color de la luna */
      --text-main: #f0e6d3;       /* Texto principal */
      --text-soft: #b8a99a;       /* Texto secundario */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--night-deep);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ---------- LIENZO DE ESTRELLAS ---------- */
    #star-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* ---------- LUNA ---------- */
    .moon {
      position: fixed;
      top: 12%;
      right: 12%;
      width: 90px;
      height: 90px;
      background: radial-gradient(circle at 35% 35%, var(--moon), #e8c86a 60%, #c9a84c);
      border-radius: 50%;
      box-shadow: 
        0 0 40px rgba(244, 211, 94, 0.4),
        0 0 80px rgba(244, 211, 94, 0.2);
      z-index: 0;
      animation: moonGlow 6s ease-in-out infinite alternate;
    }

    @keyframes moonGlow {
      from { box-shadow: 0 0 40px rgba(244, 211, 94, 0.35), 0 0 80px rgba(244, 211, 94, 0.15); }
      to   { box-shadow: 0 0 55px rgba(244, 211, 94, 0.5), 0 0 100px rgba(244, 211, 94, 0.25); }
    }

    /* ---------- NAVEGACIÓN ---------- */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.3rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(10, 20, 40, 0.75), transparent);
    }

    .logo {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.35rem;
      color: var(--star-yellow);
      text-decoration: none;
      letter-spacing: 0.06em;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-soft);
      text-decoration: none;
      font-size: 0.88rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      transition: color 0.3s ease;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--star-yellow);
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--star-yellow);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* Menú móvil */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--star-yellow);
      font-size: 1.6rem;
      cursor: pointer;
    }

    /* ---------- HERO (contenido principal) ---------- */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .hero-tag {
      font-size: 0.85rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--star-yellow);
      margin-bottom: 1.3rem;
      opacity: 0;
      animation: fadeUp 1.2s 0.3s forwards;
    }

    .hero h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2.8rem, 7vw, 4.6rem);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 1.3rem;
      opacity: 0;
      animation: fadeUp 1.2s 0.5s forwards;
    }

    .hero h1 span {
      color: var(--star-yellow);
      font-style: italic;
    }

    .hero-subtitle {
      font-size: 1.2rem;
      color: var(--text-soft);
      max-width: 460px;
      margin: 0 auto 2.8rem;
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 1.2s 0.7s forwards;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.95rem 2.1rem;
      background: transparent;
      border: 1px solid var(--star-yellow);
      color: var(--star-yellow);
      text-decoration: none;
      font-size: 0.88rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 50px;
      transition: all 0.4s ease;
      opacity: 0;
      animation: fadeUp 1.2s 0.9s forwards;
    }

    .hero-cta:hover {
      background: var(--star-yellow);
      color: var(--night-deep);
      box-shadow: 0 0 28px rgba(244, 211, 94, 0.35);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(25px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Indicador de scroll */
    .scroll-hint {
      position: absolute;
      bottom: 2.8rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--text-soft);
      opacity: 0;
      animation: fadeUp 1.2s 1.2s forwards;
    }

    /* ---------- RESPONSIVE (móvil) ---------- */
    @media (max-width: 768px) {
      .nav {
        padding: 1.1rem 1.5rem;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(10, 20, 40, 0.97);
        flex-direction: column;
        padding: 1.5rem;
        gap: 1.3rem;
      }

      .nav-links.open {
        display: flex;
      }

      .menu-toggle {
        display: block;
      }

      .moon {
        width: 60px;
        height: 60px;
        top: 10%;
        right: 8%;
      }
    }
  </style>
</head>
<body>

  <!-- Lienzo donde se dibujan las estrellas -->
  <canvas id="star-canvas"></canvas>

  <!-- Luna -->
  <div class="moon"></div>

  <!-- Menú de navegación -->
  <nav class="nav">
    <a href="index.html" class="logo">✦ Ixomar Cautela</a>
    
    <button class="menu-toggle" aria-label="Abrir menú">☰</button>
    
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="#">Gustos</a></li>
      <li><a href="#">Experiencias</a></li>
      <li><a href="#">Trabajos</a></li>
      <li><a href="#">Contacto</a></li>
    </ul>
  </nav>

  <!-- Contenido principal de la portada -->
  <section class="hero">
    <div class="hero-content">
      <p class="hero-tag">Te doy la bienvenida</p>
      <h1>Ixomar Cautela<br><span>De la imaginación a la realidad</span></h1>
      <p class="hero-subtitle">
        Aquí te muestro quien soy:
        Creativa · Multifacética · En constante aprendizaje.
      </p>
      <a href="#" class="hero-cta">Explorar →</a>
    </div>
    <div class="scroll-hint">Desliza para descubrir</div>
  </section>

  <script>
    // ============================================
    // ANIMACIÓN DE ESTRELLAS
    // ============================================
    const canvas = document.getElementById('star-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    function createStars() {
      stars = [];
      // Cantidad de estrellas según el tamaño de la pantalla
      const count = Math.floor((width * height) / 3200);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.6 + 0.3,
          opacity: Math.random(),
          twinkleSpeed: Math.random() * 0.02 + 0.005,
          twinkleDirection: Math.random() > 0.5 ? 1 : -1
        });
      }
    }

    function draw() {
      // Fondo
      ctx.fillStyle = '#0a1428';
      ctx.fillRect(0, 0, width, height);

      // Dibujar cada estrella
      stars.forEach(star => {
        // Efecto de parpadeo
        star.opacity += star.twinkleSpeed * star.twinkleDirection;
        if (star.opacity >= 1 || star.opacity <= 0.2) {
          star.twinkleDirection *= -1;
        }

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 236, 139, ${star.opacity})`;
        ctx.fill();

        // Brillo extra en estrellas más grandes
        if (star.radius > 1.2) {
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.radius * 2.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(244, 211, 94, ${star.opacity * 0.15})`;
          ctx.fill();
        }
      });

      requestAnimationFrame(draw);
    }

    // Iniciar
    resize();
    createStars();
    draw();

    window.addEventListener('resize', () => {
      resize();
      createStars();
    });

    // ============================================
    // MENÚ MÓVIL
    // ============================================
    const menuToggle = document.querySelector('.menu-toggle');
    const navLinks = document.querySelector('.nav-links');

    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('open');
    });
  </script>
</body>
</html>
